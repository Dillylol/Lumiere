name: Robot library checks
on:
  push:
    paths: ["robot/**", "quickstart/sources.json", ".github/workflows/ci-robot.yml"]
  pull_request:
    paths: ["robot/**", "quickstart/sources.json", ".github/workflows/ci-robot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, and release artifacts
        run: ./gradlew :ftc-lib:testDebugUnitTest :sim:testDebugUnitTest :ftc-lib:lintRelease :sim:lintRelease :ftc-lib:assembleRelease :sim:assembleRelease publishToMavenLocal --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: |
            robot/*/build/reports/**
            robot/*/build/test-results/**
          retention-days: 7

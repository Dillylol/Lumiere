[package]
name = "studio"
version = "0.1.1"
description = "Offline-first FTC programming studio"
authors = ["The Lumière Contributors"]
license = "BSD-3-Clause"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.10"
tauri-plugin-persisted-scope = "2.3.8"

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.11", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

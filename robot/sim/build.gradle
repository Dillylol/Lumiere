plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// The desktop simulator. It is used only from a robot project's local unit tests and is never
// installed on the Robot Controller.
android {
    namespace 'dev.lumiere.sim'
    compileSdk 30

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'GradleDependency', 'OldTargetApi', 'Aligned16KB'
        // The simulator runs only on a desktop JVM, never on an Android device.
        disable 'NewApi'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':ftc-lib')

    // Provided by the robot project's unit-test classpath.
    compileOnly "org.firstinspires.ftc:RobotCore:${pinned.FTC_SDK_VERSION}"
    compileOnly "org.firstinspires.ftc:Hardware:${pinned.FTC_SDK_VERSION}"
    compileOnly 'junit:junit:4.13.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.firstinspires.ftc:RobotCore:${pinned.FTC_SDK_VERSION}"
    testImplementation "org.firstinspires.ftc:Hardware:${pinned.FTC_SDK_VERSION}"
    testImplementation "com.pedropathing:revhub:${pinned.PEDRO_VERSION}"
    testImplementation "com.pedropathing.ivy:core:${pinned.IVY_VERSION}"
    testImplementation "com.pedropathing.ivy:pedro:${pinned.IVY_VERSION}"
    testImplementation "com.squareup.okhttp3:okhttp:4.12.0"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'sim'
            }
        }
    }
}
